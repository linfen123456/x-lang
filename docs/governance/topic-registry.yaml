schema_version: "1.0"
kind: xlang-topic-registry
required_front_matter:
  - doc_id
  - authority
  - owner
  - version
  - maturity
  - status
  - phase
  - last_reviewed
  - traceability_scope
topics:
  - id: TOPIC-LANGUAGE
    paths: [docs/specs, docs/stdlib, docs/ffi, docs/web, docs/style]
    authority: normative
    phases: [P0, P1, P2, P3, P4, P5, P6]
  - id: TOPIC-ENGINEERING
    paths: [docs/compiler, docs/runtime, docs/tools, docs/implementation]
    authority: implementation
    phases: [P0, P1, P2, P3, P4, P5, P6]
  - id: TOPIC-QUALITY
    paths: [docs/testing, docs/ci, docs/operations]
    authority: evidence
    phases: [P0, P1, P2, P3, P4, P5, P6]
  - id: TOPIC-GOVERNANCE
    paths: [docs/governance]
    authority: master
    phases: [P0, P1, P2, P3, P4, P5, P6]
  - id: TOPIC-AI-RESEARCH
    paths: [docs/ai, labs]
    authority: research
    phases: [P3, P4, P5, P6]
validation:
  every_markdown_under_topic_path_requires_front_matter: true
  every_front_matter_doc_requires_owner_and_traceability: true
  original_sources_are_read_only: true
